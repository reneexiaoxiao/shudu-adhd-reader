<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>舒读 · 阅读与收藏</title>
    <link rel="stylesheet" href="popup-shell.css">
    <link rel="stylesheet" href="ui-theme.css">
  </head>
  <body>
    <header class="shell-header">
      <div class="shell-brand">
        <img src="icons/icon48.png" width="38" height="38" alt="">
        <div>
          <p>ADHD 阅读与知识收藏</p>
          <h1>舒读</h1>
        </div>
        <span class="shell-version" id="extensionVersion"></span>
      </div>
      <label class="collection-option">
        <span>收藏同步到 Obsidian</span>
        <input id="collectionEnabled" type="checkbox" role="switch" aria-describedby="collectionModeStatus" disabled>
      </label>
      <p id="collectionModeStatus" class="collection-mode-status" role="status">读取设置中…</p>
      <nav class="feature-tabs" role="tablist" aria-label="舒读功能">
        <button id="readerTab" type="button" role="tab" aria-controls="featureFrame" aria-selected="true" data-view="reader">阅读</button>
        <button id="collectorTab" type="button" role="tab" aria-controls="featureFrame" aria-selected="false" data-view="collector">收藏</button>
      </nav>
    </header>
    <main>
      <iframe id="featureFrame" src="reader-popup.html" title="阅读设置"></iframe>
    </main>
    <script src="collector/collection-mode.js"></script>
    <script src="popup-shell.js"></script>
  </body>
</html>
