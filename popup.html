<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>舒读</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header class="topbar">
        <div class="brand">
          <img class="brand-icon" src="icons/icon48.png" width="44" height="44" alt="">
          <div>
            <p class="eyebrow">ADHD 网页阅读器</p>
            <h1>舒读</h1>
          </div>
        </div>
        <label class="switch" aria-label="启用舒读">
          <input id="enabled" type="checkbox">
          <span aria-hidden="true"></span>
        </label>
      </header>

      <p id="status" class="status" role="status">正在连接当前页面…</p>

      <section class="translation-panel" aria-labelledby="translation-title">
        <div class="section-heading">
          <h2 id="translation-title">智能译读</h2>
          <span id="translationApiState">GLM API · 未配置</span>
        </div>
        <p class="translation-intro">边滚动边补译；按六级 524 分水平，保留 3–5 个 B2+/C1 英文表达，不拿基础词凑数。</p>
        <label class="field-row" for="translationRetention">
          <span>英文保留</span>
          <select id="translationRetention">
            <option value="concepts">核心概念 · 1–2 个</option>
            <option value="cet6">六级 524 · 3–5 个</option>
            <option value="intensive">强化学习 · 5–8 个</option>
          </select>
        </label>
        <div class="translation-actions">
          <button id="toggleTranslation" class="translation-primary" type="button">开启滚动译读</button>
          <button id="clearTranslations" class="translation-secondary" type="button">清除译文</button>
        </div>
        <p class="shortcut-hint">快捷键：⌥ + ⇧ + F</p>
        <p id="translationStatus" class="translation-status" role="status" aria-live="polite">正在检查译读配置…</p>

        <details class="api-settings">
          <summary>智谱 API 设置</summary>
          <label class="api-field" for="zhipuApiKey">
            <span>API Key</span>
            <input id="zhipuApiKey" type="password" autocomplete="off" spellcheck="false" placeholder="仅保存在本机；已保存的 Key 不回显">
          </label>
          <label class="api-field" for="translationModel">
            <span>模型代码</span>
            <input id="translationModel" type="text" autocomplete="off" spellcheck="false" value="glm-5.2">
          </label>
          <div class="api-actions">
            <button id="saveAndTestApi" type="button">保存并测试</button>
            <button id="clearApiKey" type="button">删除 Key</button>
          </div>
          <p class="api-note">使用智谱开放平台标准 API。Key 存在 <code>chrome.storage.local</code>，不会同步到云端或写入源码。</p>
        </details>
      </section>

      <section aria-labelledby="preset-title">
        <div class="section-heading">
          <h2 id="preset-title">阅读节奏</h2>
          <span>一键切换</span>
        </div>
        <div class="segmented" role="group" aria-label="阅读预设">
          <button type="button" data-preset="light">轻盈</button>
          <button type="button" data-preset="balanced">专注</button>
          <button type="button" data-preset="immersive">沉浸</button>
        </div>
      </section>

      <section aria-labelledby="layout-title">
        <div class="section-heading">
          <h2 id="layout-title">版面</h2>
          <output id="widthOutput" for="contentWidth">980 px</output>
        </div>
        <label class="range-row">
          <span>正文宽度</span>
          <input id="contentWidth" type="range" min="640" max="2400" step="20">
        </label>
        <label class="range-row">
          <span>字号</span>
          <input id="fontSize" type="range" min="15" max="30" step="1">
          <output id="fontSizeOutput" for="fontSize">18 px</output>
        </label>
        <label class="range-row">
          <span>行距</span>
          <input id="lineHeight" type="range" min="1.45" max="2.1" step="0.05">
          <output id="lineHeightOutput" for="lineHeight">1.75×</output>
        </label>
        <label class="range-row">
          <span>段落间距</span>
          <input id="paragraphGap" type="range" min="0.3" max="1.4" step="0.05">
          <output id="paragraphGapOutput" for="paragraphGap">0.68×</output>
        </label>
        <label class="field-row" for="fontFamily">
          <span>正文字体</span>
          <select id="fontFamily">
            <option value="torch" data-font-name="Sino-Torch">中华薪火体（中文）</option>
            <option value="xingkai" data-font-name="Xingkai SC">行楷</option>
            <option value="hannotate" data-font-name="Hannotate SC">手札体</option>
            <option value="hanzipen" data-font-name="HanziPen SC">翩翩体</option>
            <option value="engraved" data-font-name="FZDiaoBanSongS">方正雕版宋</option>
            <option value="fangsong" data-font-name="STFangsong">仿宋</option>
            <option value="kaiti" data-font-name="Kaiti SC">楷体</option>
            <option value="serif" data-font-name="Songti SC">宋体</option>
            <option value="sans" data-font-name="PingFang SC">苹方黑体</option>
            <option value="original">保留原字体</option>
          </select>
        </label>
        <p id="fontHint" class="hint">正在检测字体…</p>
      </section>

      <section aria-labelledby="emphasis-title">
        <div class="section-heading">
          <h2 id="emphasis-title">语义强调</h2>
          <span>全文仅在本地处理</span>
        </div>
        <label class="check-row"><input id="boldEnabled" type="checkbox"><span>自动加粗关键词与数字</span></label>
        <label class="check-row"><input id="highlightEnabled" type="checkbox"><span>半高透明马克笔</span></label>
        <label class="check-row"><input id="multiColorEnabled" type="checkbox"><span>多色语义：重点 · 概念 · 行动 · 证据 · 程度</span></label>
        <div class="semantic-legend" aria-label="语义颜色图例">
          <span data-semantic-color="priority">重点</span>
          <span data-semantic-color="concept">概念</span>
          <span data-semantic-color="action">行动</span>
          <span data-semantic-color="evidence">证据</span>
          <span data-semantic-color="degree">程度</span>
        </div>
        <div class="marker-row" role="group" aria-label="马克笔颜色">
          <span>单色模式</span>
          <button type="button" data-color="amber" aria-label="琥珀黄"></button>
          <button type="button" data-color="mint" aria-label="薄荷绿"></button>
          <button type="button" data-color="coral" aria-label="珊瑚粉"></button>
          <button type="button" data-color="blue" aria-label="湖水蓝"></button>
        </div>
        <label class="range-row">
          <span>强调密度</span>
          <input id="emphasisDensity" type="range" min="0" max="100" step="5">
          <output id="densityOutput" for="emphasisDensity">75%</output>
        </label>
        <label class="check-row"><input id="focusEnabled" type="checkbox"><span>鼠标经过时标记当前段落（无蒙版）</span></label>
      </section>

      <footer>
        <span>不上传正文 · 不改动原网页</span>
        <button id="applyPage" type="button">重新分析</button>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
